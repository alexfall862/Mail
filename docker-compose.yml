# Local development database only. Production Postgres is managed by Railway.
services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kdp_mail
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
